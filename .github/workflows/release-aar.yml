name: Release AAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record checked-out SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Ktlint
        run: ./gradlew ktlintCheck

      - name: Run tests
        run: ./gradlew shared:testDebugUnitTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: shared/build/reports/
          retention-days: 1

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read library version
        id: version
        run: |
          VERSION=$(./gradlew -q :shared:properties | awk '/^version:/ { print $2 }')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release AARs
        run: ./gradlew :shared:bundleReleaseAar :shared:packageFatAar

      - name: Stage AARs
        run: |
          mkdir -p artifacts
          V="${{ steps.version.outputs.value }}"
          cp shared/build/outputs/aar/shared-release.aar     "artifacts/aitutor-${V}.aar"
          cp shared/build/outputs/aar/shared-release-fat.aar "artifacts/aitutor-${V}-fat.aar"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aitutor-aar
          path: artifacts/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ needs.verify.outputs.sha }}
          files: |
            artifacts/aitutor-${{ steps.version.outputs.value }}.aar
            artifacts/aitutor-${{ steps.version.outputs.value }}-fat.aar
          fail_on_unmatched_files: true
